<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle of Olympus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px,4vw,32px);
  font-family:"DM Sans",system-ui,sans-serif;
  color:#1a1528;
  background:#6b7a8f url("assets/landing-bg.png") center/cover no-repeat fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,rgba(15,20,35,0.25) 0%,rgba(25,35,55,0.35) 100%);
  pointer-events:none;
}
.landing{
  position:relative;
  z-index:1;
  width:min(100%,380px);
  padding:clamp(28px,6vw,40px) clamp(24px,5vw,36px);
  text-align:center;
  border-radius:24px;
  background:rgba(255,255,255,0.38);
  border:1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.12),
    inset 0 1px 0 rgba(255,255,255,0.85);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.class-label{
  font-family:"Cinzel",Georgia,serif;
  font-size:clamp(1.75rem,6vw,2.125rem);
  font-weight:700;
  letter-spacing:0.08em;
  color:#0f1419;
  text-shadow:0 1px 0 rgba(255,255,255,0.5);
  margin-bottom:8px;
}
.enter-hint{
  font-size:15px;
  font-weight:500;
  color:#2c3544;
  margin-bottom:26px;
  letter-spacing:0.02em;
}
.enter-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  padding:0 36px;
  font-family:"DM Sans",system-ui,sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  text-decoration:none;
  color:#fff;
  border:none;
  border-radius:14px;
  cursor:pointer;
  background:linear-gradient(180deg,#1e3a5f 0%,#152a45 100%);
  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 6px 24px rgba(15,30,50,0.35),inset 0 1px 0 rgba(255,255,255,0.15);
  transition:transform 0.15s ease,box-shadow 0.15s ease,filter 0.15s ease;
}
.enter-btn:hover{
  filter:brightness(1.06);
  box-shadow:0 8px 28px rgba(15,30,50,0.4),inset 0 1px 0 rgba(255,255,255,0.2);
}
.enter-btn:active{transform:scale(0.98)}
</style>
</head>
<body>
  <main class="landing" role="main">
    <p class="class-label">Class 4</p>
    <p class="enter-hint">Enter here</p>
    <a class="enter-btn" href="oracle_clues_final.html">Enter</a>
  </main>
</body>
</html>
