<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle of Olympus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px,4vw,32px);
  font-family:"DM Sans",system-ui,sans-serif;
  color:#1a1528;
  background:#6b7a8f url("assets/landing-bg.png") center/cover no-repeat fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,rgba(15,20,35,0.25) 0%,rgba(25,35,55,0.35) 100%);
  pointer-events:none;
}
.landing{
  position:relative;
  z-index:1;
  width:min(100%,380px);
  padding:clamp(28px,6vw,40px) clamp(24px,5vw,36px);
  text-align:center;
  border-radius:24px;
  background:rgba(255,255,255,0.38);
  border:1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.12),
    inset 0 1px 0 rgba(255,255,255,0.85);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.class-label{
  font-family:"Cinzel",Georgia,serif;
  font-size:clamp(1.75rem,6vw,2.125rem);
  font-weight:700;
  letter-spacing:0.08em;
  color:#0f1419;
  text-shadow:0 1px 0 rgba(255,255,255,0.5);
  margin-bottom:8px;
}
.enter-hint{
  font-size:15px;
  font-weight:500;
  color:#2c3544;
  margin-bottom:26px;
  letter-spacing:0.02em;
}
.enter-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  padding:0 36px;
  font-family:"DM Sans",system-ui,sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  text-decoration:none;
  color:#fff;
  border:none;
  border-radius:14px;
  cursor:pointer;
  background:linear-gradient(180deg,#1e3a5f 0%,#152a45 100%);
  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 6px 24px rgba(15,30,50,0.35),inset 0 1px 0 rgba(255,255,255,0.15);
  transition:transform 0.15s ease,box-shadow 0.15s ease,filter 0.15s ease;
}
.enter-btn:hover{
  filter:brightness(1.06);
  box-shadow:0 8px 28px rgba(15,30,50,0.4),inset 0 1px 0 rgba(255,255,255,0.2);
}
.enter-btn:active{transform:scale(0.98)}

.fs-toggle{
  position:fixed;
  z-index:10;
  top:clamp(10px,2vw,18px);
  right:clamp(10px,2vw,18px);
  width:34px;
  height:34px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#2c3544;
  background:rgba(255,255,255,0.45);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.7);
  border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,0.1);
  cursor:pointer;
  transition:transform 0.15s ease,background 0.15s,box-shadow 0.15s;
}
.fs-toggle:hover{
  background:rgba(255,255,255,0.62);
  box-shadow:0 6px 20px rgba(0,0,0,0.12);
}
.fs-toggle:active{transform:scale(0.97)}
.fs-toggle:focus-visible{outline:2px solid #1e3a5f;outline-offset:3px}
.fs-toggle svg{display:block;flex-shrink:0}
html:fullscreen,html:-webkit-full-screen{background:#6b7a8f}

/* Teaching story — same footprint as fullscreen; readable on photo bg */
.teacher-story-link{
  position:fixed;
  z-index:10;
  bottom:clamp(10px,2vw,18px);
  left:clamp(10px,2vw,18px);
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#1a2433;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.75);
  border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
  transition:transform 0.2s ease,background 0.2s,box-shadow 0.2s;
}
.teacher-story-link:hover,.teacher-story-link:focus-visible{
  background:rgba(255,255,255,0.82);
  box-shadow:0 6px 22px rgba(0,0,0,0.18);
  transform:scale(1.05);
  outline:none;
}
.teacher-story-link:focus-visible{
  box-shadow:0 0 0 2px #1e3a5f,0 6px 22px rgba(0,0,0,0.18);
}
.teacher-story-link svg{display:block}
</style>
</head>
<body>
  <a href="teaching-story.html" class="teacher-story-link" aria-label="Teaching slide: the story behind the mystery" title="The story (for the teacher)">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9h8v7a2.5 2.5 0 0 1-2.5 2.5H8.5A2.5 2.5 0 0 1 6 16V9z"/>
      <path d="M14 11.5h1.5a2 2 0 0 1 0 4H14"/>
      <path d="M8 5.5c0 .8-.6 1.4-.6 2.2M11 5c0 1-.7 1.7-.7 2.8"/>
    </svg>
  </a>
  <button type="button" class="fs-toggle" id="fsToggle" aria-pressed="false" aria-label="Enter fullscreen" title="Enter fullscreen (Esc to exit)">
    <svg class="fs-enter" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></g></svg>
    <svg class="fs-exit" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" hidden><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></g></svg>
  </button>
  <main class="landing" role="main">
    <p class="class-label">Class 4</p>
    <p class="enter-hint">Enter here</p>
    <a class="enter-btn" href="oracle_clues_final.html">Enter</a>
  </main>
  <script>
  (function(){
    var FS_RESUME_KEY='oracleFsResume';
    var root=document.documentElement;
    function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement||null;}
    function syncToggle(){
      var btn=document.getElementById('fsToggle');
      if(!btn)return;
      var on=!!fsEl();
      btn.setAttribute('aria-pressed',on?'true':'false');
      btn.setAttribute('aria-label',on?'Exit fullscreen':'Enter fullscreen');
      btn.title=on?'Exit fullscreen (Esc)':'Enter fullscreen (Esc to exit)';
      var a=btn.querySelector('.fs-enter'),b=btn.querySelector('.fs-exit');
      if(a)a.hidden=on;if(b)b.hidden=!on;
    }
    function onFullscreenEvent(){
      if(!fsEl()){try{sessionStorage.removeItem(FS_RESUME_KEY);}catch(e){}}
      syncToggle();
    }
    function enter(){
      var r=root.requestFullscreen||root.webkitRequestFullscreen||root.msRequestFullscreen;
      if(!r)return Promise.reject();
      return Promise.resolve(r.call(root));
    }
    function exit(){
      var x=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
      if(x)return Promise.resolve(x.call(document));
      return Promise.resolve();
    }
    var enterLink=document.querySelector('.enter-btn');
    if(enterLink){
      enterLink.addEventListener('click',function(){
        try{
          if(fsEl()) sessionStorage.setItem(FS_RESUME_KEY,'1');
          else sessionStorage.removeItem(FS_RESUME_KEY);
        }catch(e){}
      });
    }
    var btn=document.getElementById('fsToggle');
    if(btn){
      btn.addEventListener('click',function(){(fsEl()?exit():enter()).catch(function(){});});
    }
    document.addEventListener('fullscreenchange',onFullscreenEvent);
    document.addEventListener('webkitfullscreenchange',onFullscreenEvent);
    document.addEventListener('MSFullscreenChange',onFullscreenEvent);
    syncToggle();
  })();
  </script>
</body>
</html>
